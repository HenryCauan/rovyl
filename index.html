<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"
    />
    <title>Zenith Radial Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: transparent; /* Alterado para transparente */
        color: #ffffff;
        overflow: hidden;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100vw;
        height: 100vh;
      }
      /* Hide default context menu for better app feel */
      .no-context {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Custom Range Slider Styles */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        background: transparent;
        outline: none;
      }

      /* Track (Linha) */
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        transition: background 0.2s;
      }

      input[type="range"]:hover::-webkit-slider-runnable-track {
        background: rgba(255, 255, 255, 0.15);
      }

      /* Thumb (Bolinha) */
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #ffffff;
        /* Adiciona uma borda da cor do fundo do modal para "recortar" e suavizar a borda */
        border: 4px solid #141414;
        cursor: pointer;
        /* Centralização: (height track - height thumb) / 2 = (4 - 20) / 2 = -8 */
        margin-top: -8px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          0 2px 4px rgba(0, 0, 0, 0.5);
        transition:
          transform 0.1s ease,
          background-color 0.2s;
      }

      input[type="range"]:hover::-webkit-slider-thumb {
        transform: scale(1.1);
        background: #ffffff;
        border-color: #1a1a1a;
      }

      input[type="range"]:active::-webkit-slider-thumb {
        transform: scale(0.95);
        background: #e0e0e0;
      }

      /* Firefox styles (just in case) */
      input[type="range"]::-moz-range-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }
      input[type="range"]::-moz-range-thumb {
        height: 20px;
        width: 20px;
        border: 4px solid #141414;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.1),
          0 2px 4px rgba(0, 0, 0, 0.5);
      }
      /* Custom Scrollbar Styles */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
        background-clip: content-box;
      }
    </style>
  </head>
  <body class="no-context">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
